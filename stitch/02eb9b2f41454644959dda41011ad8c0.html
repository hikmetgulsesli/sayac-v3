<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary": "#68000a",
              "on-tertiary-fixed": "#410004",
              "surface-container-highest": "#2e3447",
              "tertiary": "#ffb4ae",
              "tertiary-fixed": "#ffdad7",
              "tertiary-container": "#ff8a83",
              "surface-container-high": "#23293c",
              "surface-tint": "#4ae176",
              "outline": "#869585",
              "secondary-container": "#404754",
              "inverse-primary": "#006e2f",
              "secondary-fixed": "#dce2f3",
              "outline-variant": "#3d4a3d",
              "on-tertiary-fixed-variant": "#930013",
              "on-background": "#dce1fb",
              "error-container": "#93000a",
              "surface-container-low": "#151b2d",
              "on-secondary-fixed": "#151c27",
              "surface-container-lowest": "#070d1f",
              "on-secondary": "#2a313d",
              "primary": "#4be277",
              "on-error": "#690005",
              "surface-dim": "#0c1324",
              "on-secondary-fixed-variant": "#404754",
              "on-primary-fixed-variant": "#005321",
              "on-tertiary-container": "#860011",
              "secondary-fixed-dim": "#c0c7d6",
              "primary-container": "#22c55e",
              "on-surface-variant": "#bccbb9",
              "tertiary-fixed-dim": "#ffb3ad",
              "on-surface": "#dce1fb",
              "surface-container": "#191f31",
              "error": "#ffb4ab",
              "surface-bright": "#33394c",
              "on-secondary-container": "#aeb5c5",
              "secondary": "#c0c7d6",
              "on-primary": "#003915",
              "background": "#0c1324",
              "surface-variant": "#2e3447",
              "on-primary-container": "#004b1e",
              "on-error-container": "#ffdad6",
              "primary-fixed-dim": "#4ae176",
              "surface": "#0c1324",
              "inverse-surface": "#dce1fb",
              "primary-fixed": "#6bff8f",
              "on-primary-fixed": "#002109",
              "inverse-on-surface": "#2a3043"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-morphism {
        background: rgba(46, 52, 71, 0.6);
        backdrop-filter: blur(20px);
      }
    </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen selection:bg-primary/30">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-[100] bg-[#0c1324] flex justify-between items-center px-8 py-6 w-full no-line tonal-shift-bg">
<div class="text-xl font-bold text-green-500 tracking-tighter font-['Space_Grotesk'] uppercase">
            KINETIC
        </div>
<div class="flex gap-6 items-center">
<button class="text-slate-400 hover:text-green-300 transition-colors scale-95 duration-200">
<span class="material-symbols-outlined">history</span>
</button>
<button class="text-slate-400 hover:text-green-300 transition-colors scale-95 duration-200">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<main class="max-w-5xl mx-auto px-6 pt-12 pb-32">
<!-- Main Content Canvas -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
<!-- Left: Counter Display Section (Hero) -->
<div class="md:col-span-7 flex flex-col items-start gap-2">
<span class="text-primary font-headline font-bold tracking-widest text-xs uppercase opacity-80 mb-2">Mevcut Durum</span>
<h1 class="font-headline font-bold text-[10rem] md:text-[14rem] leading-none tracking-tighter text-on-surface -ml-2 select-none">
                    0
                </h1>
<div class="max-w-md mt-4">
<p class="text-on-surface-variant text-xl leading-relaxed font-light">
                        Kullanıma hazırsınız. <span class="text-primary font-medium">Sayacı artırarak</span> başlayabilirsiniz.
                    </p>
</div>
</div>
<!-- Right: Action Controls (The Contact Points) -->
<div class="md:col-span-5 flex flex-col gap-6 w-full pt-8 md:pt-20">
<!-- Primary Action: Increase -->
<button class="group relative w-full h-32 md:h-40 bg-gradient-to-br from-primary to-primary-container rounded-full flex items-center justify-between px-10 active:scale-95 transition-transform overflow-hidden shadow-[0_20px_50px_rgba(34,197,94,0.15)]">
<div class="flex flex-col items-start">
<span class="text-on-primary font-headline font-bold text-3xl tracking-tight uppercase">ARTIR</span>
<span class="text-on-primary/70 text-sm font-medium tracking-wide uppercase">Değeri Yükselt</span>
</div>
<span class="material-symbols-outlined text-on-primary text-5xl font-light opacity-80 group-hover:scale-110 transition-transform">add_circle</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<div class="flex gap-4 w-full">
<!-- Secondary Action: Decrease -->
<button class="flex-1 h-24 bg-error-container rounded-full flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform group">
<span class="material-symbols-outlined text-white text-2xl group-hover:-translate-y-1 transition-transform">remove</span>
<span class="text-white font-label font-bold text-xs uppercase tracking-widest">AZALT</span>
</button>
<!-- Functional Action: Reset -->
<button class="flex-1 h-24 bg-secondary-container rounded-full flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform group">
<span class="material-symbols-outlined text-on-secondary-container text-2xl group-hover:rotate-180 transition-transform duration-500">restart_alt</span>
<span class="text-on-secondary-container font-label font-bold text-xs uppercase tracking-widest">SIFIRLA</span>
</button>
</div>
<!-- Bento Info Card (Empty State Context) -->
<div class="mt-8 p-8 bg-surface-container-low rounded-full flex items-center gap-6 group hover:bg-surface-container-high transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined">info</span>
</div>
<div class="flex flex-col">
<span class="text-on-surface font-semibold text-sm">Oturum Bilgisi</span>
<span class="text-on-surface-variant text-xs font-light">Henüz herhangi bir aktivite kaydedilmedi.</span>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Semantic Selection: Counter is Active) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 pb-8 pt-4 bg-[#0c1324]/60 backdrop-blur-xl z-50 shadow-[0_-40px_40px_rgba(34,197,94,0.04)] tonal-shift-bg bg-[#151b2d]">
<a class="flex flex-col items-center justify-center text-green-400 bg-[#23293c] rounded-xl px-4 py-2 hover:bg-[#23293c] transition-all scale-98 active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined mb-1">plus_one</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase">Counter</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 px-4 py-2 hover:bg-[#23293c] transition-all scale-98 active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined mb-1">format_list_bulleted</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase">Logs</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 px-4 py-2 hover:bg-[#23293c] transition-all scale-98 active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined mb-1">query_stats</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase">Analytics</span>
</a>
</nav>
<!-- Background Decorative Element (Atmospheric Monolith Vibe) -->
<div class="fixed top-0 right-0 w-[500px] h-[500px] bg-primary/5 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
<div class="fixed bottom-0 left-0 w-[300px] h-[300px] bg-surface-container-highest/20 blur-[80px] rounded-full -z-10 pointer-events-none"></div>
</body></html>
