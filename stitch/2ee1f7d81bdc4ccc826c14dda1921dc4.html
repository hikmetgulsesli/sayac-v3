<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KINETIC - Ana Sayaç</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary": "#68000a",
              "on-tertiary-fixed": "#410004",
              "surface-container-highest": "#2e3447",
              "tertiary": "#ffb4ae",
              "tertiary-fixed": "#ffdad7",
              "tertiary-container": "#ff8a83",
              "surface-container-high": "#23293c",
              "surface-tint": "#4ae176",
              "outline": "#869585",
              "secondary-container": "#404754",
              "inverse-primary": "#006e2f",
              "secondary-fixed": "#dce2f3",
              "outline-variant": "#3d4a3d",
              "on-tertiary-fixed-variant": "#930013",
              "on-background": "#dce1fb",
              "error-container": "#93000a",
              "surface-container-low": "#151b2d",
              "on-secondary-fixed": "#151c27",
              "surface-container-lowest": "#070d1f",
              "on-secondary": "#2a313d",
              "primary": "#4be277",
              "on-error": "#690005",
              "surface-dim": "#0c1324",
              "on-secondary-fixed-variant": "#404754",
              "on-primary-fixed-variant": "#005321",
              "on-tertiary-container": "#860011",
              "secondary-fixed-dim": "#c0c7d6",
              "primary-container": "#22c55e",
              "on-surface-variant": "#bccbb9",
              "tertiary-fixed-dim": "#ffb3ad",
              "on-surface": "#dce1fb",
              "surface-container": "#191f31",
              "error": "#ffb4ab",
              "surface-bright": "#33394c",
              "on-secondary-container": "#aeb5c5",
              "secondary": "#c0c7d6",
              "on-primary": "#003915",
              "background": "#0c1324",
              "surface-variant": "#2e3447",
              "on-primary-container": "#004b1e",
              "on-error-container": "#ffdad6",
              "primary-fixed-dim": "#4ae176",
              "surface": "#0c1324",
              "inverse-surface": "#dce1fb",
              "primary-fixed": "#6bff8f",
              "on-primary-fixed": "#002109",
              "inverse-on-surface": "#2a3043"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0c1324;
            font-family: 'Inter', sans-serif;
            color: #dce1fb;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-[#0c1324] flex justify-between items-center px-8 py-6 z-50">
<div class="text-xl font-bold text-green-500 tracking-tighter font-['Space_Grotesk'] uppercase">
            KINETIC
        </div>
<div class="flex gap-6">
<button aria-label="Geçmiş" class="text-slate-400 hover:text-green-300 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button aria-label="Ayarlar" class="text-slate-400 hover:text-green-300 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 pb-32">
<!-- Atmospheric Background Element -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 blur-[120px] rounded-full"></div>
</div>
<div class="relative z-10 w-full max-w-2xl flex flex-col">
<!-- Counter Section -->
<section class="flex flex-col items-start md:items-center mb-16 px-4">
<span class="font-label text-xs tracking-[0.2em] uppercase text-on-surface-variant mb-4">Mevcut Değer</span>
<div class="font-headline text-[8rem] md:text-[12rem] leading-none font-bold tracking-tighter text-on-surface transition-all duration-300">
                    42
                </div>
<div class="h-1 w-24 bg-primary-container/20 mt-4 rounded-full"></div>
</section>
<!-- Control Panel -->
<section class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
<!-- Increase Button (The Hero Action) -->
<button aria-label="ARTIR" class="md:col-span-3 h-24 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-xl flex items-center justify-between px-8 group active:scale-95 duration-150 shadow-lg shadow-primary/10">
<div class="flex flex-col items-start">
<span class="font-label text-[10px] font-bold uppercase tracking-widest opacity-80">Eylem</span>
<span class="font-headline text-2xl font-bold tracking-tight">ARTIR</span>
</div>
<span class="material-symbols-outlined text-4xl" data-icon="add_circle">add_circle</span>
</button>
<!-- Decrease Button -->
<button aria-label="AZALT" class="h-24 bg-error-container text-error rounded-xl flex flex-col items-center justify-center group active:scale-95 duration-150">
<span class="material-symbols-outlined text-3xl mb-1" data-icon="remove_circle">remove_circle</span>
<span class="font-label text-[10px] font-bold uppercase tracking-tighter">AZALT</span>
</button>
<!-- Reset Button -->
<button aria-label="SIFIRLA" class="md:col-span-4 h-16 bg-surface-container-high hover:bg-surface-bright text-on-secondary-container rounded-xl flex items-center justify-center gap-3 transition-all duration-200 active:scale-98">
<span class="material-symbols-outlined text-xl" data-icon="restart_alt">restart_alt</span>
<span class="font-label text-xs font-bold uppercase tracking-widest">SIFIRLA</span>
</button>
</section>
<!-- Metadata/Bento Sub-details -->
<section class="grid grid-cols-2 gap-4 mt-12">
<div class="bg-surface-container-low p-6 rounded-xl border-l-2 border-primary/20">
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant block mb-2">Son Güncelleme</span>
<span class="font-body text-sm font-medium">Bugün, 14:32</span>
</div>
<div class="bg-surface-container-low p-6 rounded-xl border-l-2 border-secondary/20">
<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant block mb-2">Hedef</span>
<span class="font-body text-sm font-medium">100</span>
</div>
</section>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 pb-8 pt-4 bg-[#0c1324]/60 backdrop-blur-xl shadow-[0_-40px_40px_rgba(34,197,94,0.04)] z-50">
<!-- Active Tab: Counter -->
<a class="flex flex-col items-center justify-center text-green-400 bg-[#23293c] rounded-xl px-4 py-2 scale-98 transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="plus_one">plus_one</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase">Counter</span>
</a>
<!-- Inactive Tab: Logs -->
<a class="flex flex-col items-center justify-center text-slate-500 px-4 py-2 hover:bg-[#23293c] transition-all duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="format_list_bulleted">format_list_bulleted</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase">Logs</span>
</a>
<!-- Inactive Tab: Analytics -->
<a class="flex flex-col items-center justify-center text-slate-500 px-4 py-2 hover:bg-[#23293c] transition-all duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="query_stats">query_stats</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase">Analytics</span>
</a>
</nav>
<!-- Decorative Canvas Elements -->
<div class="fixed top-1/4 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-[80px] -z-10"></div>
<div class="fixed bottom-1/4 -left-20 w-48 h-48 bg-error/5 rounded-full blur-[60px] -z-10"></div>
</body></html>
